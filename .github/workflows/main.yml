name: Update V2Ray Configs

on:
  schedule:
    # هر 6 ساعت یکبار اجرا شود (زمان دلخواه)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # امکان اجرای دستی از تب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (if any)
      run: |
        python -m pip install --upgrade pip
        # در صورت نیاز به کتابخانه‌ی خاصی مانند requests، خط زیر را فعال کنید
        # pip install requests

    - name: Fetch configs (fetch_configs.py)
      run: python fetch_configs.py

    - name: Remove duplicates (delete_duplicate_name.py)
      run: python delete_duplicate_name.py

    - name: Organize configs by protocol (organize_configs.py)
      run: python organize_configs.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        # اگر تغییری وجود داشت commit کن
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update configs: fetch, deduplicate, organize [skip ci]"
        git push
